  <text x="490" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Zudilin (2001): at least one of ζ(5), ζ(7), ζ(9), ζ(11) is irrational — proof architecture</text>
  <text x="490" y="46" text-anchor="middle" class="t3">status snapshot 2026-09-25 · Prove2Me mission FCP.Zeta.zudilin_five_seven_nine_eleven</text>

  <!-- goal -->
  <rect class="goal" x="250" y="60" width="480" height="70"/>
  <text x="490" y="86" text-anchor="middle" class="ts">Mission goal · FCP.Zeta.zudilin_five_seven_nine_eleven · Open</text>
  <text x="490" y="106" text-anchor="middle" class="t">first decomposition accepted (SKETCH_ACCEPTED)</text>
  <text x="490" y="123" text-anchor="middle" class="t2">∃ a ∈ {5, 7, 9, 11} : ζ(a) is irrational</text>

  <!-- construction -->
  <rect class="open" x="40" y="180" width="440" height="130"/>
  <text x="260" y="204" text-anchor="middle" class="t" font-weight="bold">1 · Construction — Lemma 1 · Open</text>
  <text x="260" y="226" text-anchor="middle" class="t2">params: r=3, q=13 · η₀=91, η₁=η₂=η₃=27, η₄=29…η₁₃=38</text>
  <text x="260" y="246" text-anchor="middle" class="t2">Rₙ(t) rational function ⇒ Fₙ = (1/2!) Σ Rₙ″(t)</text>
  <text x="260" y="266" text-anchor="middle" class="t2">Λₙ = D³·D…D·Φₙ⁻¹·Fₙ ∈ ℤ + ℤζ(5)+ℤζ(7)+ℤζ(9)+ℤζ(11)</text>
  <text x="260" y="286" text-anchor="middle" class="t2">integrality &amp; coefficient control (Lemma 1 (3))</text>

  <!-- bridge -->
  <rect class="proved" x="510" y="180" width="430" height="100"/>
  <text x="725" y="204" text-anchor="middle" class="t" font-weight="bold">Bridge · zetaR k = riemannZeta k · Proved</text>
  <text x="725" y="226" text-anchor="middle" class="t2">for all k ≥ 2 (Dirichlet series identity)</text>
  <text x="725" y="246" text-anchor="middle" class="t2">transfers “Irrational (zetaR a)” into the goal’s</text>
  <text x="725" y="264" text-anchor="middle" class="t2">“∃ x : ℝ, Irrational x ∧ riemannZeta a = x”</text>

  <!-- saddle -->
  <rect class="open" x="40" y="360" width="300" height="130"/>
  <text x="190" y="384" text-anchor="middle" class="t" font-weight="bold">2a · Saddle point τ₀ · Open</text>
  <text x="190" y="406" text-anchor="middle" class="t2">exists_saddle_root_params13</text>
  <text x="190" y="426" text-anchor="middle" class="t2">charPoly τ₀ = 0 · Im τ₀ &gt; 0</text>
  <text x="190" y="444" text-anchor="middle" class="t2">maximal Re among upper roots</text>
  <text x="190" y="462" text-anchor="middle" class="t2">Re τ₀ &lt; 91 · Im f₀(τ₀) ∉ πℤ</text>
  <text x="190" y="480" text-anchor="middle" class="t3">⇒ Fₙ ≠ 0 (non-vanishing)</text>

  <!-- asymptotics -->
  <rect class="open" x="360" y="360" width="280" height="130"/>
  <text x="500" y="384" text-anchor="middle" class="t" font-weight="bold">2b · Asymptotics — Lemma 2 · Open</text>
  <text x="500" y="406" text-anchor="middle" class="t2">complex integral + Stirling + saddle point</text>
  <text x="500" y="428" text-anchor="middle" class="t2">limsup log|Fₙ|/n = Re f₀(τ₀) = −C₀</text>
  <text x="500" y="452" text-anchor="middle" class="t2" font-weight="bold">C₀ = 227.58019641…</text>

  <!-- arithmetic -->
  <rect class="open" x="660" y="360" width="280" height="130"/>
  <text x="800" y="384" text-anchor="middle" class="t" font-weight="bold">2c · Arithmetic — Lemma 1 (3) · Open</text>
  <text x="800" y="406" text-anchor="middle" class="t2">PNT: log D_{mⱼn}/n → mⱼ</text>
  <text x="800" y="424" text-anchor="middle" class="t2">Chudnovsky–Rukhadze–Hata: log Φₙ/n → ϖ</text>
  <text x="800" y="446" text-anchor="middle" class="t2">denominators of Λₙ ≈ e^{C₁n}</text>
  <text x="800" y="466" text-anchor="middle" class="t2" font-weight="bold">C₁ = 226.24944266…</text>

  <!-- criterion -->
  <rect class="open" x="250" y="540" width="480" height="110"/>
  <text x="490" y="566" text-anchor="middle" class="t" font-weight="bold">3 · Diophantine criterion — Lemma 3 · Open</text>
  <text x="490" y="588" text-anchor="middle" class="t2">numeric_C0_gt_C1: C₁ &lt; C₀ (margin ≈ 1.3308)</text>
  <text x="490" y="608" text-anchor="middle" class="t2">⇒ |Λₙ| ≤ e^{(C₁−C₀+o(1))n} → 0, with Λₙ ≠ 0</text>
  <text x="490" y="628" text-anchor="middle" class="t2">if all four were rational: Λₙ ∈ (1/Q)ℤ∖{0} ⇒ |Λₙ| ≥ 1/Q — contradiction</text>
  <text x="490" y="646" text-anchor="middle" class="t2">⇒ ∃ k ∈ {1,2,3,4} : Irrational (zetaR (3+2k))</text>

  <text x="490" y="758" text-anchor="middle" class="t2">bridge ⇒ ∃ a ∈ {5,7,9,11} : ζ(a) irrational ∎</text>
